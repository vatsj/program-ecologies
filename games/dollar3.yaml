# Divide the dollar (Nash demand), three demands L = 1/3 < M = 1/2 < H = 2/3.
# Each player demands d; if the two demands sum to at most 1 each gets its demand, otherwise both get 0.
# Level order is ascending demand, so ROLE plays (L | H) and flip maps d -> 1 - d.
# Maximin action: L (compatible with every demand, guarantees 1/3).
actions: [L, M, H]
values: {L: 0.3333333333333333, M: 0.5, H: 0.6666666666666666}
payoffs:
  L: {L: 0.3333333333333333, M: 0.3333333333333333, H: 0.3333333333333333}
  M: {L: 0.5, M: 0.5, H: 0.0}
  H: {L: 0.6666666666666666, M: 0.0, H: 0.0}
minimax_action: L
