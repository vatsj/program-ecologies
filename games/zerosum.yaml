# Matching pennies, ROLE-symmetrised.  Player 1 wants a match, player 2 a mismatch.
actions: [Tails, Heads]   # level order A_0 < A_1 (A_1 is the DSL name C, A_0 is D)
payoffs:
  Heads: {Heads: 1,  Tails: -1}
  Tails: {Heads: -1, Tails: 1}
payoffs2:            # player 2's payoff, [player-2 action][player-1 action]
  Heads: {Heads: -1, Tails: 1}
  Tails: {Heads: 1,  Tails: -1}
minimax_action: Heads
minimax_action2: Heads
